# shellcheck shell=bash  # sourced by dracut
# vtoyboot-ng: map the Ventoy vdisk in the initramfs (see /etc/vtoyboot-ng)
_vt_wants=/etc/systemd/system/initrd-root-device.target.wants
install_items+=" /etc/vtoyboot-ng/hook/ventoy-map.sh "
install_items+=" /etc/systemd/system/ventoy-map.service "
install_items+=" ${_vt_wants}/ventoy-map.service "
install_items+=" @BINARIES@ "
_vt_kver=$(uname -r)
_vt_kver=${kernel:-${_vt_kver}}
# add_drivers goes to instmods -c, which is not optional: a module the target
# kernel lacks makes dracut log "FAILED" for the whole batch. Filtering here
# instead of at install time also keeps the list right across kernel updates.
# shellcheck disable=SC2043  # @DRIVERS@ is a list
for _m in @DRIVERS@; do
  modinfo -k "${_vt_kver}" -n "${_m}" >/dev/null 2>&1 \
    && add_drivers+=" ${_m} "
done
unset _m _vt_wants _vt_kver
